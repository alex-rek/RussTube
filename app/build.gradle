plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')

android {
    namespace = 'ru.tubetv.app'
    compileSdk 36

    buildFeatures { buildConfig = true }

    flavorDimensions += 'device'
    productFlavors {
        tv {
            dimension 'device'
            manifestPlaceholders = [launcherTarget: 'ru.tubetv.app.BrowseActivity']
            buildConfigField 'boolean', 'MOBILE_VARIANT', 'false'
        }
        mobile {
            dimension 'device'
            applicationIdSuffix '.mobile'
            manifestPlaceholders = [launcherTarget: 'ru.tubetv.app.MobileBrowseActivity']
            buildConfigField 'boolean', 'MOBILE_VARIANT', 'true'
        }
    }

    defaultConfig {
        applicationId 'ru.russtube.tv'
        minSdk 23
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 40
        versionName '0.6.26'
        buildConfigField "boolean", "UPDATES_ENABLED", "true"
        resourceConfigurations += ['ru']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                    '/DebugProbesKt.bin',
                    '/kotlin/**',
                    '/META-INF/*.version',
                    '/META-INF/versions/**',
                    '/META-INF/version-control-info.textproto'
            ]
        }
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.okhttp.core
    implementation libs.okhttp.urlconnection
    implementation(libs.zxing.embedded) { transitive = false }
    implementation libs.zxing.core
    implementation libs.media3.exoplayer
    implementation libs.media3.exoplayer.hls
    implementation libs.media3.exoplayer.dash

    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.junit
}
