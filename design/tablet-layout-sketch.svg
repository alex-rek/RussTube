  <text x="1350" y="1214" text-anchor="middle" font-size="20" fill="#aec1da">▣</text>
  <text x="1350" y="1233" text-anchor="middle" font-size="11" fill="#aec1da">Фильмы</text>
  <text x="1460" y="1214" text-anchor="middle" font-size="20" fill="#aec1da">◉</text>
  <text x="1460" y="1233" text-anchor="middle" font-size="11" fill="#aec1da">В эфире</text>
  <text x="1570" y="1214" text-anchor="middle" font-size="20" fill="#aec1da">♡</text>
  <text x="1570" y="1233" text-anchor="middle" font-size="11" fill="#aec1da">Подписки</text>
  <text x="1680" y="1214" text-anchor="middle" font-size="20" fill="#aec1da">☷</text>
  <text x="1680" y="1233" text-anchor="middle" font-size="11" fill="#aec1da">Вы</text>

