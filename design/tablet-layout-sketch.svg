<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1310" viewBox="0 0 1800 1310" role="img" aria-label="Набросок планшетного интерфейса RussTube: каталог в горизонтальной и вертикальной ориентации, плеер в горизонтальной ориентации">
  <defs>
    <linearGradient id="back" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243b"/></linearGradient>
    <linearGradient id="aurora" x2="1" y2="1"><stop stop-color="#00d9c0"/><stop offset=".48" stop-color="#19c8ff"/><stop offset="1" stop-color="#855bff"/></linearGradient>
    <linearGradient id="thumbA" x2="1" y2="1"><stop stop-color="#125c70"/><stop offset=".52" stop-color="#16498b"/><stop offset="1" stop-color="#332477"/></linearGradient>
    <linearGradient id="thumbB" x2="1" y2="1"><stop stop-color="#543957"/><stop offset=".55" stop-color="#173c68"/><stop offset="1" stop-color="#118e98"/></linearGradient>
    <linearGradient id="thumbC" x2="1" y2="1"><stop stop-color="#155452"/><stop offset=".52" stop-color="#28718a"/><stop offset="1" stop-color="#142a62"/></linearGradient>
    <linearGradient id="video" x2="1" y2="1"><stop stop-color="#0e4169"/><stop offset=".5" stop-color="#253e78"/><stop offset="1" stop-color="#622d72"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <symbol id="card" viewBox="0 0 250 188">
      <rect width="250" height="188" rx="14" fill="#10243b"/>
