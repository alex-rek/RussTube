      <path d="M0 112 Q72 62 137 111 T250 76 V140 H0Z" fill="#00d9c0" opacity=".22"/>
      <path d="M0 138 Q85 102 148 131 T250 94 V140 H0Z" fill="#020d27" opacity=".52"/>
      <circle cx="207" cy="39" r="19" fill="#00162b" opacity=".6"/>
      <path d="M202 30 L202 48 L216 39 Z" fill="#f4f8ff"/>
      <rect x="9" y="9" width="28" height="28" rx="7" fill="#071426" opacity=".85"/>
      <text x="23" y="29" text-anchor="middle" font-size="18" fill="#00d9c0" font-weight="700">R</text>
      <rect x="202" y="112" width="39" height="20" rx="5" fill="#071426" opacity=".85"/>
      <text x="221" y="127" text-anchor="middle" font-size="12" fill="white">12:40</text>
      <text x="12" y="161" font-size="15" fill="#f4f8ff" font-weight="700">Название видео</text>
      <text x="12" y="178" font-size="11" fill="#aec1da">Канал · 2 дня назад</text>
    </symbol>
    <style>
      text{font-family:Arial,Segoe UI,sans-serif}
      .section{font-size:24px;font-weight:700;fill:#f4f8ff}
      .label{font-size:17px;fill:#aec1da}
      .small{font-size:14px;fill:#aec1da}
      .nav{font-size:15px;fill:#f4f8ff}
      .frame{fill:url(#back);stroke:#285071;stroke-width:2}
    </style>
  </defs>
  <rect width="1800" height="1310" fill="#04101e"/>
  <text x="42" y="42" font-size="28" font-weight="700" fill="#f4f8ff">RussTube · набросок для планшета</text>
